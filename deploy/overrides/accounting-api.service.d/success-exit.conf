# Restart-noise fix (2026-07-27, applied live same day): doppler-run wraps
# uvicorn and exits 255 when its child is terminated by the stop signal, so
# every deploy restart marked the unit failed and paged via OnFailure
# (Jul 24-25 alert storm). 255-on-stop is routine; real Python crashes exit 1
# and still alert. Liveness is separately covered by accounting-uptime-check
# (5-min probe) and Restart=always.
# Install: copy to /etc/systemd/system/accounting-api.service.d/ + daemon-reload.
[Service]
SuccessExitStatus=255
